[build]
  base = "front-end"
  command = "npm install && npm run build"
  publish = "front-end/dist"

[[redirects]]
  from = "/api/*"
  to = "https://nextjuris-api.onrender.com/api/:splat"
  # IMPORTANTE: Apos criar o servico no Render, atualize a URL acima
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
