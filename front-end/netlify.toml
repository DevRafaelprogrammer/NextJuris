[build]
  base = "front-end"
  command = "npm install && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://nextjuris-api.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "netlify"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
